# Builds the Windows app: an NSIS installer and a portable exe.
#
# The Mac workflow exists because a .dmg cannot be cross-built. This one exists
# for the opposite reason: Windows *can* be cross-built from Linux, but doing it
# on windows-latest is the only way to run the thing we ship. A build that is
# never launched is a build that is only probably an app.
#
# Manual trigger only, and it never touches a release. The files land as run
# artifacts, get launched on a real PC, and are attached to a release by hand.
# A release is public the moment it exists, so that step stays a human command
# (docs/release.md).
#
# Repository secrets, set once. None are required for the build to succeed: the
# app is usable with only an AI key pasted in Settings, and an empty value is
# written as an empty string, which src/config.js reports as "not configured".
#   NUS_GCAL_CLIENT_ID, NUS_GCAL_CLIENT_SECRET
#   NUS_OUTLOOK_CLIENT_ID
#
# Deliberately absent: NUS_SUPABASE_URL / NUS_SUPABASE_ANON_KEY. This build has
# no accounts, and the workflow does not ask for the credentials of a server
# that is no longer part of the product.
name: build-windows

on:
  workflow_dispatch:
    inputs:
      smoke_only:
        description: 'Build and smoke-test, skip the installers'
        type: boolean
        default: false

permissions:
  contents: read

# Everything that is expensive and does not change between runs, named once.
# A key change here invalidates that cache; nothing else does.
#
# The Fable archive is pinned by a full SHA-256 (see the fetch step), which is
# what makes it safe to cache by that pin alone: a cached archive that did not
# match the pin could never have been stored.
env:
  FABLE_ARCHIVE: kokoro-multi-lang-v1_0.tar.bz2
  FABLE_PIN: 60703707bc05ccd48d60e1eb723f38b07d6e474795a0b6a588d7220400e0f7a4
  # The same asset's size, from the release API. A download that stops early
  # hashes wrong, and "hash mismatch" alone does not say whether the network
  # truncated it or the pin is stale; the size says which.
  FABLE_BYTES: 349886476

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # electron and electron-builder keep their downloads in %LOCALAPPDATA%,
      # not in node_modules. Without these two caches a cold run re-downloads
      # the Electron binary (~100 MB) and the builder's toolchain (~50 MB) every
      # single time, which is most of what makes a package build feel slow.
      - name: Cache the Electron binary and the builder toolchain
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/electron-cache
            ${{ runner.temp }}/builder-cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-
        env:
          # Read by electron's install script and by app-builder-lib
          # (binDownload.js). Pointing both at runner.temp keeps them off the
          # default profile path, so one cache action can carry both.
          ELECTRON_CACHE: ${{ runner.temp }}/electron-cache
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/builder-cache

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_CACHE: ${{ runner.temp }}/electron-cache
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/builder-cache

      # src/config.js is gitignored and required at startup, so a clean checkout
      # has nothing for src/main.js to require. This build has no server and no
      # account, so with no secrets set it writes empty values, which the app
      # reports as "not configured" (isGoogleCalendarConfigured and friends).
      #
      # --allow-empty exists for exactly this: the first run of this workflow
      # failed here because write-config treats an empty value as missing, and
      # setting the variables to '' in PowerShell did not change that. The flag
      # is deliberate rather than a weakening: without it a genuine deployment
      # that forgot a key still fails loudly.
      - name: Write src/config.js
        shell: pwsh
        env:
          NUS_GCAL_CLIENT_ID: ${{ secrets.NUS_GCAL_CLIENT_ID }}
          NUS_GCAL_CLIENT_SECRET: ${{ secrets.NUS_GCAL_CLIENT_SECRET }}
          NUS_OUTLOOK_CLIENT_ID: ${{ secrets.NUS_OUTLOOK_CLIENT_ID }}
        run: node scripts/write-config.js --allow-empty

      # The test step failed twice in CI with nothing readable from outside: the
      # run log lives in blob storage, and the annotations only said "exit code
      # 1". A failure nobody can read is a failure that costs a day, so the
      # failing test names are written into the annotations themselves, where
      # they are visible in the UI and over the API without fetching the log.
      #
      # `npm test` is still what runs; this only instruments it.
      - name: Test
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'test.log'
          npm test 2>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $lines = Get-Content $log
            $failed = $lines | Select-String -Pattern '^\s*not ok \d+ - ' | ForEach-Object { $_.Line.Trim() }
            $summary = $lines | Select-String -Pattern '^# (pass|fail|cancelled|tests) ' | ForEach-Object { $_.Line.Trim() }
            Write-Host '--- failing tests ---'
            $failed | ForEach-Object { Write-Host $_ }
            Write-Host '--- counts ---'
            $summary | ForEach-Object { Write-Host $_ }
            # Newest first, and short enough for the annotation limit.
            $msg = (($failed + $summary) -join "`n")
            if ($msg.Length -gt 60000) { $msg = $msg.Substring(0, 60000) }
            if (-not $msg) { $msg = 'npm test failed but printed no "not ok" line; see the log artifact.' }
            Write-Output "::error title=Test failures::$($msg -replace "`r?`n", '%0A')"
            # Keep the whole log for the run, so nothing is ever unreadable again.
            Copy-Item $log (Join-Path $env:GITHUB_WORKSPACE 'test-output.log') -Force
          }
          exit $code

      # ~65 MB of whisper.cpp plus the base model, from two hosts that are not
      # npm. Cached by the tag the script pins, so a new pin fetches again.
      - name: Cache the whisper binary and model
        uses: actions/cache@v4
        with:
          path: vendor/whisper
          key: whisper-b4938-x64-${{ runner.os }}
          # No restore-keys: a partial whisper directory is a broken one, and
          # setup:voice treats a stale binary as done (findExe succeeds).

      # setup:voice reaches two networks that are not npm (a GitHub release and
      # Hugging Face), and when it fails the run log is unreadable from outside,
      # exactly like the Test step's was. Same treatment: the reason goes into
      # the annotation, the whole output into an artifact. A four-second red
      # step that says only "exit code 1" is the failure this replaces.
      - name: Fetch the whisper binary the Windows build bundles
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'setup-voice.log'
          npm run setup:voice 2>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $tail = (Get-Content $log -Tail 40) -join "`n"
            if ($tail.Length -gt 60000) { $tail = $tail.Substring($tail.Length - 60000) }
            if (-not $tail) { $tail = 'setup:voice failed and printed nothing.' }
            Write-Output "::error title=setup:voice failed::$($tail -replace "`r?`n", '%0A')"
            Copy-Item $log (Join-Path $env:GITHUB_WORKSPACE 'setup-voice.log') -Force
          }
          exit $code

      # The pre-made voice lines are the slowest thing in this build: a few
      # hundred short WAVs, synthesized one at a time on the runner's CPU. That
      # is pure work, and it only changes when a line changes, so the finished
      # folder is cached against the source files that define the lines.
      #
      # Both caches below share the FABLE_PIN key: the model and the lines made
      # from it always travel together, so they cannot be half-restored into a
      # mismatch.
      - name: Cache the built voice lines
        id: lines-cache
        uses: actions/cache@v4
        with:
          path: vendor/voice-lines
          key: voice-lines-${{ env.FABLE_PIN }}-${{ hashFiles('companion/src/voice/lines.js', 'companion/src/tour.js', 'companion/src/voice/index.js') }}

      # `npm run dist` begins with make-voice-lines.js, which needs the Fable
      # model in vendor/voice. vendor/ is gitignored (the model is ~300 MB), and
      # nothing in the repo downloads it into the tree, so this step is not
      # boilerplate: without it the build stops at line one of the script.
      #
      # The archive is cached by its own pin, and the hash check below still
      # runs on every build: a cache hit is a shortcut for the download, never a
      # substitute for the verification.
      - name: Cache the Fable voice archive
        id: fable-cache
        uses: actions/cache@v4
        with:
          path: vendor/voice-archive
          key: fable-${{ env.FABLE_PIN }}

      - name: Fetch the Fable voice model for the pre-built lines
        shell: pwsh
        env:
          # A cold cache downloads; a hit unpacks a cached archive. Either way
          # the hash is checked before anything is unpacked.
          ARCHIVE_DIR: vendor\voice-archive
        run: |
          # A 334 MB download from a release page, and a failure here has to be
          # readable from outside the run: the log lives in storage nobody can
          # open, so the reason goes into an annotation, with the size of what
          # landed beside it. Same deal the Test step made.
          $archive = Join-Path (Join-Path $env:GITHUB_WORKSPACE $env:ARCHIVE_DIR) $env:FABLE_ARCHIVE
          try {
            $url = 'https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/kokoro-multi-lang-v1_0.tar.bz2'
            $root = Join-Path $env:GITHUB_WORKSPACE 'vendor\voice'
            $keep = Join-Path $env:GITHUB_WORKSPACE $env:ARCHIVE_DIR
            New-Item -ItemType Directory -Force -Path $root, $keep | Out-Null
            $archive = Join-Path $keep $env:FABLE_ARCHIVE
            if (-not (Test-Path $archive)) {
              Write-Host 'Fable archive not cached; downloading.'
              Invoke-WebRequest -Uri $url -OutFile $archive -MaximumRetryCount 3
            } else {
              Write-Host 'Fable archive restored from cache; verifying it anyway.'
            }
            $size = (Get-Item $archive).Length
            Write-Host "Fable archive is $size bytes (the release has $env:FABLE_BYTES)."
            # The whole pin from companion/src/voice/index.js, not a prefix: the
            # app refuses a model that does not match this hash, so the build must
            # refuse the same one rather than shipping it and failing at run time.
            $want = $env:FABLE_PIN
            $got = (Get-FileHash -Algorithm SHA256 -Path $archive).Hash.ToLower()
            if ($got -ne $want) {
              # A cached archive that fails its pin is worse than no cache: it
              # would fail every later run too. Drop it and let the next run
              # download cleanly.
              Remove-Item $archive -Force
              throw "voice archive hash $got is not $want (removed the bad archive; re-run)"
            }
            & "$env:SystemRoot\System32\tar.exe" -xjf $archive -C $root
            if (-not (Test-Path (Join-Path $root 'voices.bin'))) { Get-ChildItem -Recurse $root | Out-String | Write-Host; throw 'the voice files did not land in vendor/voice' }
          } catch {
            $size = if (Test-Path $archive) { "$((Get-Item $archive).Length) bytes" } else { 'no file' }
            $msg = "$($_.Exception.Message) [archive: $size, expected $env:FABLE_BYTES]"
            Write-Output "::error title=Fable voice archive failed::$($msg -replace "`r?`n", '%0A')"
            exit 1
          }

      # `npm run dist` makes the fixed lines as its first act, so there is no
      # --check before it: on a clean checkout the lines do not exist yet, and a
      # guard that always fails guards nothing. The check that matters is after,
      # when they are supposed to be there.
      - name: Build installer and portable exe
        if: ${{ !inputs.smoke_only }}
        run: npm run dist -- --publish never

      - name: Check the voice lines were made
        if: ${{ !inputs.smoke_only }}
        run: node scripts/make-voice-lines.js --check

      # The asar scan is the same one the Mac build runs: it fails the build if
      # anything that must not ship is packed.
      - name: Scan the packed asar
        if: ${{ !inputs.smoke_only }}
        run: node scripts/package-security-check.js dist/win-unpacked/resources/app.asar

      # Launch the app we are about to publish. --smoke creates a window, opens
      # the database and starts the Companion, then quits itself; a package that
      # cannot do that is not a package. An isolated profile keeps the runner's
      # real %APPDATA% out of it.
      - name: Smoke the unpacked app
        if: ${{ !inputs.smoke_only }}
        shell: pwsh
        env:
          NUS_SMOKE_DATA_DIR: ${{ runner.temp }}\jarvis-smoke
        run: |
          $exe = 'dist\win-unpacked\JARVIS.exe'
          if (-not (Test-Path $exe)) { throw "no $exe; the builder named the app something else" }
          $out = & $exe --smoke 2>&1 | Out-String
          Write-Host $out
          if ($out -notmatch 'smoke ok') { throw 'the packaged app did not report smoke ok' }
          # Quit itself is part of the deal: a hung smoke run would hang the job.
          if (-not $out.Trim()) { throw 'the packaged app produced no output' }

      - name: List what was built
        if: ${{ !inputs.smoke_only }}
        shell: pwsh
        run: Get-ChildItem dist -Include *.exe,*.blockmap,*.yml -Recurse | Select-Object FullName,Length | Format-Table -AutoSize | Out-String | Write-Host

      # Always, even on failure: the run log is unreadable from outside, so this
      # artifact is the only way to see what a failed test actually said.
      - uses: actions/upload-artifact@v4
        if: ${{ always() && hashFiles('test-output.log') != '' }}
        with:
          name: test-output
          path: test-output.log
          if-no-files-found: ignore
          retention-days: 14

      # And the same for the step that fetches the whisper binary, which is the
      # one non-npm download the build depends on.
      - uses: actions/upload-artifact@v4
        if: ${{ always() && hashFiles('setup-voice.log') != '' }}
        with:
          name: setup-voice-output
          path: setup-voice.log
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.smoke_only }}
        with:
          name: jarvis-windows
          path: |
            dist/JARVIS-Setup.exe
            dist/JARVIS-Portable.exe
            dist/JARVIS-Setup.exe.blockmap
            dist/latest.yml
          if-no-files-found: error
          retention-days: 14
